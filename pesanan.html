<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pesanan — Aroma Semarang</title>
<style>
:root{--bg:#0b1120;--panel:#121a2e;--panel2:#18223b;--line:rgba(255,255,255,.1);--tx:#eef2ff;--mut:#9aa6c4;--or:#ee4d2d;--or2:#ff7337;--ok:#34d399;--bad:#fb7185;--bl:#60a5fa;--kn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(11,17,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top h1{margin:0;font-size:18px;flex:1;min-width:150px}
.top h1 small{display:block;font-size:11px;color:var(--mut);font-weight:500}
.btn{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:var(--panel2);border:1px solid var(--line);text-decoration:none;display:inline-block}
.btn.p{background:linear-gradient(135deg,var(--or),var(--or2));border:0}
.btn.d{background:rgba(251,113,133,.15);color:var(--bad);border-color:rgba(251,113,133,.35)}
.btn.s{padding:6px 10px;font-size:12px}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.login{max-width:380px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}
.login h2{margin:0 0 4px}.login p{color:var(--mut);margin:0 0 16px}
.login input{width:100%;margin-bottom:10px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}
.login .btn{width:100%}
.err{color:var(--bad);min-height:20px;margin-top:8px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.st b{display:block;font-size:22px}.st span{color:var(--mut);font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar input{flex:1;min-width:180px;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:12px}
.chip.on{background:var(--or);color:#fff;border-color:var(--or)}
.ord{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.ord .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ord .no{font-weight:800}.ord .tm{color:var(--mut);font-size:12px;margin-left:auto}
.stt{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px}
.stt.baru{background:rgba(96,165,250,.2);color:var(--bl)}.stt.proses{background:rgba(251,191,36,.2);color:var(--kn)}.stt.kirim{background:rgba(139,92,246,.25);color:#c4b5fd}.stt.selesai{background:rgba(52,211,153,.2);color:var(--ok)}.stt.batal{background:rgba(251,113,133,.2);color:var(--bad)}
.ord .cu{margin:6px 0;color:var(--mut)}
.ord .cu b{color:var(--tx)}
.its{margin:8px 0;padding:8px 10px;background:var(--bg);border-radius:10px;font-size:13px}
.its div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-top:6px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.kosong{text-align:center;color:var(--mut);padding:40px 10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000d;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:99;display:none}
.hide{display:none!important}
.warn{margin:8px 0;padding:8px 10px;border-radius:10px;background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.35);color:#fecdd3;font-size:13px}
.warn small{color:var(--mut)}
.info{margin:8px 0;padding:8px 10px;border-radius:10px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:#fde68a;font-size:13px}
</style>
</head>
<body>

<div id="vLogin" class="login hide">
  <h2>🔐 Masuk Admin</h2>
  <p>Aroma Semarang — halaman pesanan</p>
  <input id="lEmail" type="email" placeholder="Email admin" autocomplete="username">
  <input id="lPass" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn p" id="lMasuk">Masuk</button>
  <div class="err" id="lErr"></div>
</div>

<div id="vApp" class="hide">
  <div class="top">
    <h1>📦 Pesanan<small id="who"></small></h1>
    <a class="btn" href="admin.html">Admin</a>
    <a class="btn" href="produk.html">Produk</a>
    <button class="btn" id="bKeluar">Keluar</button>
  </div>
  <div class="wrap">
    <div class="stats" id="stats"></div>
    <div class="bar"><input id="cari" placeholder="🔍 Cari nomor pesanan, nama, atau nomor WA…"></div>
    <div class="chips" id="chips"></div>
    <div id="daftar"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ====== PENGATURAN ====== */
var FIREBASE_CONFIG={
  apiKey:"AIzaSyAWMBRY8TAJMCLSqTdMVKlo_U1aQCGa51k",
  authDomain:"aroma-semarang.firebaseapp.com",
  projectId:"aroma-semarang",
  storageBucket:"aroma-semarang.firebasestorage.app",
  messagingSenderId:"92275973960",
  appId:"1:92275973960:web:7653449d240a7b147d1d7d"
};
var EMAIL_ADMIN="kamu97834@gmail.com";   /* harus sama dengan email admin di Firebase dan di aturan database */
var VERSI_SDK="10.12.2";
var NAMA_TOKO="Aroma Semarang";
/* ====== JANGAN DIUBAH DI BAWAH INI ====== */
(function(){
  var $=function(i){return document.getElementById(i);};
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];});}
  function rp(n){return "Rp"+(Number(n)||0).toLocaleString("id-ID");}
  function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none";},2600);}
  var STATUS=[["baru","Baru"],["proses","Diproses"],["kirim","Dikirim"],["selesai","Selesai"],["batal","Batal"]];
  var NAMA={}; STATUS.forEach(function(s){NAMA[s[0]]=s[1];});
  var db=null, auth=null, semua=[], filter="semua", batal=null, pertama=true;
  var UK=["30 ML","50 ML","100 ML"], KAT=null, katP=null;

  /* ---- pemeriksa harga: bandingkan pesanan dengan harga, botol, promo, dan voucher toko SEKARANG ---- */
  function angka(t){return parseInt(String(t).replace(/\D/g,""),10)||0;}
  function muatKatalog(){
    if(katP) return katP;
    var u=function(f){return fetch(f+"?v="+Date.now(),{cache:"no-store"});};
    katP=Promise.all([u("index.html").then(function(r){return r.text();}), u("produk.json").then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}), u("config.json").then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})])
    .then(function(a){
      var harga={}, doc=new DOMParser().parseFromString(a[0],"text/html");
      doc.querySelectorAll("article.card").forEach(function(c){
        var d=c.querySelector(".detail-data"); if(!d||!d.dataset.code) return; var h={};
        c.querySelectorAll("tbody tr").forEach(function(r){var td=r.querySelectorAll("td"), j=td[0]&&td[0].textContent.trim().toUpperCase(); if(j) h[j]=[angka(td[1].textContent),angka(td[2].textContent),angka(td[3].textContent)];});
        harga[d.dataset.code]=h;
      });
      var pj=a[1]||{};
      Object.keys(pj.ubah||{}).forEach(function(k){ var x=pj.ubah[k]; if(harga[k]&&x&&x.harga) Object.keys(x.harga).forEach(function(j){ harga[k][j]=x.harga[j]; }); });
      (pj.hapus||[]).forEach(function(k){ delete harga[k]; });
      (pj.baru||[]).forEach(function(p){ if(p&&p.kode&&p.harga) harga[p.kode]=p.harga; });
      KAT={harga:harga,cfg:a[2]};
      tampil();
    }).catch(function(){ KAT=false; tampil(); });
    return katP;
  }
  function tglAkhir(s){ var d=new Date(s+"T23:59:59"); return isNaN(d.getTime())?null:d; }
  function berlaku(s,t){ if(!s) return true; var d=tglAkhir(s); return !d||t<=d; }
  function hitungToko(items,cfg){
    var sub=0,botol=0,i;
    for(i=0;i<items.length;i++){ sub+=items[i].price*items[i].qty; botol+=(items[i].botolHarga||0)*items[i].qty; }
    var promo=0,vou=0,v=cfg.voucher;
    if(cfg.promoAktif) promo=Math.round(sub*cfg.promoPersen/100);
    if(v && sub>=(v.min||0)){
      var dasar=cfg.gabung?(sub-promo):sub;
      vou=v.tipe==="persen"?Math.round(dasar*v.nilai/100):v.nilai;
      if(v.maks) vou=Math.min(vou,v.maks);
      vou=Math.max(0,Math.min(vou,dasar));
    }
    if(!cfg.gabung && promo>0 && vou>0){ if(vou>promo) promo=0; else vou=0; }
    return Math.max(0,sub-Math.min(sub,promo+vou))+botol;
  }
  function periksa(x){
    if(KAT===null) return {s:"tunggu",m:[]};
    if(KAT===false) return {s:"tak",m:["Daftar harga toko tidak bisa dimuat, jadi pesanan ini belum bisa dicek."]};
    var m=[], tak=0, cfg=KAT.cfg, t=(x.dibuat&&x.dibuat.toDate?x.dibuat.toDate():new Date());
    var cek=(x.items||[]).map(function(i){
      var p=KAT.harga[i.kode], ex=p&&p[i.jenis]&&p[i.jenis][UK.indexOf(i.ukuran)], ob={price:i.harga,qty:i.qty,botolHarga:i.botolHarga||0};
      if(!ex){ tak++; m.push(i.nama+" "+i.jenis+" "+i.ukuran+": tidak ditemukan di katalog sekarang, harganya tidak bisa dicek."); return ob; }
      if(ex!==i.harga){ m.push(i.nama+" "+i.jenis+" "+i.ukuran+": harga di pesanan "+rp(i.harga)+", harga di toko "+rp(ex)+"."); ob.price=ex; }
      if(cfg&&i.botol){
        var b=null; (cfg.botol||[]).forEach(function(z){ if(z.nama===i.botol) b=z; });
        if(!b){ tak++; m.push("Botol \""+i.botol+"\" tidak ada di pengaturan sekarang."); }
        else if((b.harga||0)!==(i.botolHarga||0)){ m.push("Botol "+i.botol+": harga di pesanan "+rp(i.botolHarga)+", harga di toko "+rp(b.harga)+"."); ob.botolHarga=b.harga||0; }
      }
      return ob;
    });
    if(cfg){
      var pr=cfg.promo||{}, v=null;
      (cfg.voucher||[]).forEach(function(z){ if(x.voucher && z.kode===x.voucher) v=z; });
      if(x.voucher && !v){ m.push("Voucher "+x.voucher+" tidak dikenal di pengaturan sekarang."); }
      else if(v && !berlaku(v.sampai,t) && x.potVoucher>0){ m.push("Voucher "+v.kode+" sudah kedaluwarsa saat pesanan dibuat."); v=null; }
      var seharusnya=hitungToko(cek,{promoAktif:!!(pr.aktif&&pr.persen>0&&berlaku(pr.sampai,t)),promoPersen:pr.persen||0,gabung:!!cfg.gabung,voucher:v});
      if(seharusnya!==x.total) m.push("Total di pesanan "+rp(x.total)+", seharusnya "+rp(seharusnya)+(x.total<seharusnya?" (pelanggan membayar LEBIH MURAH "+rp(seharusnya-x.total)+").":" (lebih mahal "+rp(x.total-seharusnya)+")."));
    }else tak++;
    var ada=m.some(function(z){return /harga di pesanan|Total di pesanan|kedaluwarsa|tidak dikenal/.test(z);});
    return {s:ada?"warn":(tak?"tak":"ok"),m:m};
  }

  function muat(src){return new Promise(function(ok,gagal){var s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=function(){gagal(new Error("Gagal memuat Firebase. Periksa koneksi internet."));};document.head.appendChild(s);});}
  var b="https://www.gstatic.com/firebasejs/"+VERSI_SDK+"/";
  muat(b+"firebase-app-compat.js").then(function(){return muat(b+"firebase-auth-compat.js");}).then(function(){return muat(b+"firebase-firestore-compat.js");}).then(mulai)
  .catch(function(e){ $("vLogin").classList.remove("hide"); $("lErr").textContent=e.message; });

  function mulai(){
    firebase.initializeApp(FIREBASE_CONFIG); auth=firebase.auth(); db=firebase.firestore();
    $("lMasuk").onclick=masuk; $("lPass").onkeydown=function(e){if(e.key==="Enter")masuk();};
    $("bKeluar").onclick=function(){auth.signOut();};
    auth.onAuthStateChanged(function(u){
      if(u && (u.email||"").toLowerCase()===EMAIL_ADMIN.toLowerCase()){
        $("vLogin").classList.add("hide"); $("vApp").classList.remove("hide"); $("who").textContent=u.email; dengarkan(); muatKatalog();
      }else{
        if(u){ $("lErr").textContent="Akun ini bukan admin."; auth.signOut(); }
        if(batal){batal();batal=null;} semua=[]; pertama=true;
        $("vApp").classList.add("hide"); $("vLogin").classList.remove("hide");
      }
    });
  }
  function masuk(){
    $("lErr").textContent=""; var em=$("lEmail").value.trim(), pw=$("lPass").value;
    if(!em||!pw){$("lErr").textContent="Isi email dan password.";return;}
    $("lMasuk").disabled=true;
    auth.signInWithEmailAndPassword(em,pw).catch(function(e){
      var k=e&&e.code||"";
      $("lErr").textContent=/wrong-password|invalid-credential|user-not-found|invalid-email/.test(k)?"Email atau password salah.":/too-many/.test(k)?"Terlalu banyak percobaan. Tunggu sebentar.":"Gagal masuk ("+k+").";
    }).then(function(){$("lMasuk").disabled=false;});
  }
  function dengarkan(){
    if(batal) batal();
    batal=db.collection("pesanan").orderBy("dibuat","desc").limit(300).onSnapshot(function(snap){
      var baru=0;
      if(!pertama) snap.docChanges().forEach(function(c){ if(c.type==="added") baru++; });
      semua=snap.docs.map(function(d){var x=d.data(); x.id=d.id; return x;});
      pertama=false; if(baru) toast("🔔 "+baru+" pesanan baru masuk!");
      tampil();
    },function(e){ $("daftar").innerHTML='<div class="kosong">Tidak bisa membaca pesanan ('+esc(e.code||e.message)+').<br>Pastikan aturan database (Rules) sudah dipasang dan emailnya benar.</div>'; });
  }
  function waktu(x){
    var t=x.dibuat&&x.dibuat.toDate?x.dibuat.toDate():null; if(!t) return "baru saja";
    return t.toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  }
  function nomorWa(w){var n=String(w||"").replace(/\D/g,""); if(n.indexOf("0")===0) n="62"+n.slice(1); return n;}

  function tampil(){
    var q=$("cari").value.trim().toLowerCase(), hit=semua.filter(function(x){
      if(filter==="cek"){ if(periksa(x).s!=="warn") return false; }
      else if(filter!=="semua"&&x.status!==filter) return false;
      return !q||(x.nomor+" "+x.nama+" "+x.wa).toLowerCase().indexOf(q)>=0;
    });
    var bulan=new Date().getMonth(), omzet=0, jml={}, nCek=0; STATUS.forEach(function(s){jml[s[0]]=0;});
    semua.forEach(function(x){ if(periksa(x).s==="warn") nCek++; });
    semua.forEach(function(x){ jml[x.status]=(jml[x.status]||0)+1; var t=x.dibuat&&x.dibuat.toDate?x.dibuat.toDate():null; if(x.status==="selesai"&&t&&t.getMonth()===bulan) omzet+=x.total||0; });
    $("stats").innerHTML=[["Total pesanan",semua.length],["Perlu diproses",jml.baru],["Sedang dikirim",jml.kirim],["⚠️ Harga perlu dicek",nCek],["Omzet selesai bulan ini",rp(omzet)]].map(function(s){return '<div class="st"><b>'+s[1]+'</b><span>'+s[0]+'</span></div>';}).join("");
    $("chips").innerHTML=[["semua","Semua ("+semua.length+")"]].concat(STATUS.map(function(s){return [s[0],s[1]+" ("+(jml[s[0]]||0)+")"];})).concat([["cek","⚠️ Perlu dicek ("+nCek+")"]]).map(function(c){return '<button class="chip'+(filter===c[0]?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</button>';}).join("");
    $("daftar").innerHTML=hit.length?hit.map(kartu).join(""):'<div class="kosong">'+(semua.length?"Tidak ada pesanan yang cocok.":"Belum ada pesanan masuk. 🌸")+'</div>';
  }
  function kartu(x){
    var items=(x.items||[]).map(function(i){return '<div><span>'+esc(i.nama)+' <small style="color:var(--mut)">'+esc(i.jenis)+' '+esc(i.ukuran)+(i.botol?' • '+esc(i.botol):'')+' ×'+i.qty+'</small></span><span>'+rp((i.harga+(i.botolHarga||0))*i.qty)+'</span></div>';}).join("");
    var ket='';
    if(x.botol>0) ket+='<div><span>Botol</span><span>+'+rp(x.botol)+'</span></div>';
    if(x.potPromo>0) ket+='<div><span>Promo</span><span>−'+rp(x.potPromo)+'</span></div>';
    if(x.potVoucher>0) ket+='<div><span>Voucher '+esc(x.voucher)+'</span><span>−'+rp(x.potVoucher)+'</span></div>';
    var pk=periksa(x), lb=pk.s==="ok"?'<span class="stt selesai">✅ Harga cocok</span>':pk.s==="warn"?'<span class="stt batal">⚠️ Harga tidak cocok</span>':pk.s==="tak"?'<span class="stt proses">ℹ️ Sebagian tak bisa dicek</span>':'';
    var dt=pk.m.length?'<div class="'+(pk.s==="warn"?'warn':'info')+'">'+pk.m.map(esc).join("<br>")+'<br><small>Dibandingkan dengan harga, promo, dan voucher toko saat ini. Kalau harga baru diubah setelah pesanan dibuat, perbedaan ini bisa wajar.</small></div>':'';
    var btn=STATUS.filter(function(s){return s[0]!==x.status;}).map(function(s){return '<button class="btn s" data-st="'+s[0]+'" data-id="'+esc(x.id)+'">'+s[1]+'</button>';}).join("");
    return '<div class="ord"><div class="hd"><span class="no">'+esc(x.nomor)+'</span><span class="stt '+esc(x.status)+'">'+esc(NAMA[x.status]||x.status)+'</span>'+lb+'<span class="tm">'+waktu(x)+'</span></div>'+
      '<div class="cu"><b>'+esc(x.nama)+'</b> • '+esc(x.wa)+'<br>'+esc(x.alamat)+'</div>'+
      '<div class="its">'+items+ket+'<div class="tot"><span>TOTAL</span><span>'+rp(x.total)+'</span></div></div>'+dt+
      '<div class="acts"><a class="btn s p" target="_blank" rel="noopener" href="https://wa.me/'+nomorWa(x.wa)+'">💬 Chat pelanggan</a><button class="btn s" data-cetak="'+esc(x.id)+'">🖨️ Cetak label</button>'+btn+'<button class="btn s d" data-hapus="'+esc(x.id)+'">Hapus</button></div></div>';
  }
  $("cari").oninput=tampil;
  $("chips").onclick=function(e){var t=e.target.closest("[data-f]"); if(t){filter=t.dataset.f; tampil();}};
  $("daftar").onclick=function(e){
    var t=e.target.closest("button"); if(!t) return;
    if(t.dataset.st) db.collection("pesanan").doc(t.dataset.id).update({status:t.dataset.st}).then(function(){toast("Status diubah ✔");}).catch(function(){toast("Gagal mengubah status.");});
    if(t.dataset.hapus && confirm("Hapus pesanan "+t.dataset.hapus+" selamanya?")) db.collection("pesanan").doc(t.dataset.hapus).delete().then(function(){toast("Pesanan dihapus.");}).catch(function(){toast("Gagal menghapus.");});
    if(t.dataset.cetak) cetak(t.dataset.cetak);
  };
  function cetak(id){
    var x=null; semua.forEach(function(o){if(o.id===id)x=o;}); if(!x) return;
    var w=window.open("","_blank"); if(!w){toast("Pop-up diblokir. Izinkan pop-up lalu coba lagi.");return;}
    var it=(x.items||[]).map(function(i){return '<li>'+esc(i.nama)+' — '+esc(i.jenis)+' '+esc(i.ukuran)+' ×'+i.qty+'</li>';}).join("");
