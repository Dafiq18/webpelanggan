<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pesanan Saya — Aroma Semarang</title>
<style>
:root{--bg:#0b0813;--panel:#161127;--panel2:#1d1733;--line:rgba(255,255,255,.09);--tx:#f3f0ff;--mut:#a79fc2;--ac:#8b5cf6;--ac2:#22d3ee;--or:#ee4d2d;--or2:#ff7337;--ok:#34d399;--bad:#fb7185;--kn:#fbbf24;--bl:#60a5fa;--vi:#c4b5fd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(800px 420px at 85% -8%,rgba(236,72,153,.16),transparent),radial-gradient(700px 400px at 0% 10%,rgba(139,92,246,.18),transparent),var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--or2),var(--or));padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 22px rgba(238,77,45,.28)}
.top a,.top button{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;text-decoration:none;font-weight:900;border:0;font-size:18px;cursor:pointer;flex:0 0 auto}
.top b{font-size:18px;flex:1;letter-spacing:-.01em}
.top button.putar{animation:putar .8s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
.wrap{max-width:600px;margin:0 auto;padding:12px 14px 70px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;position:sticky;top:62px;z-index:15;background:linear-gradient(var(--bg) 70%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:99px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab em{font-style:normal;background:rgba(255,255,255,.1);border-radius:99px;min-width:20px;padding:0 6px;font-size:11px;line-height:20px;text-align:center}
.tab.on{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(238,77,45,.3)}
.tab.on em{background:rgba(255,255,255,.28)}
.ord{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;margin-top:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.28);position:relative}
.ord::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--wr,var(--mut))}
.ord.s-baru{--wr:var(--bl)}.ord.s-proses{--wr:var(--kn)}.ord.s-kirim{--wr:#a78bfa}.ord.s-selesai{--wr:var(--ok)}.ord.s-batal,.ord.s-hilang{--wr:var(--bad)}
.hd{display:flex;gap:8px;align-items:center;padding:14px 16px 0 18px;flex-wrap:wrap}
.no{font-weight:800;letter-spacing:.03em;font-size:15px}
.salin{border:0;background:rgba(255,255,255,.08);color:var(--mut);border-radius:8px;padding:3px 8px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
.tg{color:var(--mut);font-size:12px;margin-left:auto}
.baru-titik{background:var(--or);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:2px 8px;animation:kedip 1.4s ease-in-out infinite}
@keyframes kedip{50%{opacity:.5}}
.sb{display:flex;gap:11px;align-items:center;margin:12px 16px 0 18px;padding:11px 13px;border-radius:14px;background:color-mix(in srgb,var(--wr) 16%,transparent);border:1px solid color-mix(in srgb,var(--wr) 38%,transparent)}
.sb i{font-style:normal;font-size:26px;line-height:1}
.sb b{display:block;font-size:15px;color:var(--wr)}
.sb small{display:block;color:#d9d3ee;font-size:12.5px;line-height:1.4}
.pg{display:flex;align-items:flex-start;margin:14px 16px 0 18px}
.pg div{flex:1;text-align:center;position:relative;font-size:11px;color:var(--mut)}
.pg div::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0;border-radius:3px}
.pg div:first-child::before{display:none}
.pg div.ok::before{background:linear-gradient(90deg,var(--ok),var(--ok))}
.pg span{position:relative;z-index:1;display:grid;place-items:center;width:28px;height:28px;margin:0 auto 4px;border-radius:50%;background:#241c3d;border:2px solid var(--line);font-size:13px}
.pg div.ok span{background:rgba(52,211,153,.2);border-color:var(--ok)}
.pg div.on span{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;box-shadow:0 0 0 4px rgba(139,92,246,.25)}
.pg div.on{color:var(--tx);font-weight:800}.pg div.ok{color:#cdeede}
.ring{padding:12px 16px 0 18px;color:#e4defa;font-size:14px}
.ring small{color:var(--mut)}
.bw{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 14px 18px;cursor:pointer}
.bw b{font-size:17px}.bw span{color:var(--ac2);font-size:13px;font-weight:700}
.det{display:none;padding:4px 16px 16px 18px;border-top:1px solid var(--line)}
.ord.buka .det{display:block}
.tl{list-style:none;margin:12px 0 0;padding:0}
.tl li{position:relative;padding:0 0 15px 38px;color:var(--mut)}
.tl li::before{content:"";position:absolute;left:11px;top:24px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li i{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:#241c3d;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px}
.tl li.on{color:var(--tx);font-weight:800}
.tl li.on i{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff}
.tl li.lalu{color:var(--tx)}.tl li.lalu i{background:rgba(52,211,153,.22);border-color:var(--ok);color:var(--ok)}
.tl small{display:block;font-weight:500;color:var(--mut)}
.item{display:flex;justify-content:space-between;gap:10px;color:#dcd6f2;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.item:last-of-type{border-bottom:0}
.sub{color:var(--mut);font-size:12px;margin-top:8px}
.msg{padding:12px 14px;border-radius:12px;background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.35);color:#fecdd3;margin-top:10px;font-size:14px}
.aksi{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.aksi a,.aksi button{flex:1 1 auto;text-align:center;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx);text-decoration:none;font:inherit;font-weight:800;font-size:13px;cursor:pointer}
.aksi .wa{background:linear-gradient(135deg,#22c55e,#15803d);border:0;color:#fff}
.aksi .ul{background:linear-gradient(135deg,var(--or),var(--or2));border:0;color:#fff}
.aksi .hps{color:var(--bad);flex:0 0 auto}
.kosong{text-align:center;padding:42px 16px 18px;color:var(--mut)}
.kosong .ic{font-size:52px}
.kosong b{display:block;color:var(--tx);font-size:17px;margin:6px 0 4px}
.cari{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:22px}
.cari h3{margin:0 0 4px;font-size:15px}.cari p{margin:0 0 10px;color:var(--mut);font-size:13px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;text-transform:uppercase;letter-spacing:.04em}
.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:800;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--or),var(--or2))}
.btn:disabled{opacity:.6}
.kecil{color:var(--mut);font-size:12px;margin-top:14px;text-align:center}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:#241c3d;color:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.28s;z-index:50;max-width:92vw;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.skel{height:150px;border-radius:20px;margin-top:12px;background:linear-gradient(100deg,var(--panel) 30%,var(--panel2) 50%,var(--panel) 70%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="top"><a href="index.html" aria-label="Kembali">‹</a><b>📦 Pesanan Saya</b><button id="segar" aria-label="Segarkan" title="Segarkan">⟳</button></div>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="daftar"></div>
  <div class="cari">
    <h3>Punya nomor pesanan dari perangkat lain?</h3>
    <p>Ketik nomornya (ada di pesan WhatsApp-mu), misalnya <b>AS-1111-ABCD</b>.</p>
    <div class="row"><input id="no" placeholder="AS-0000-XXXX" autocomplete="off" maxlength="39"><button class="btn" id="cari">Lacak</button></div>
    <div id="hasilCari"></div>
  </div>
  <div class="kecil" id="info">Daftar pesanan disimpan di perangkat ini. Status diperbarui oleh admin toko.</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ====== PENGATURAN ====== */
var FIREBASE_CONFIG={
  apiKey:"AIzaSyAWMBRY8TAJMCLSqTdMVKlo_U1aQCGa51k",
  authDomain:"aroma-semarang.firebaseapp.com",
  projectId:"aroma-semarang",
  storageBucket:"aroma-semarang.firebasestorage.app",
  messagingSenderId:"92275973960",
  appId:"1:92275973960:web:7653449d240a7b147d1d7d"
};
var NOMOR_WA="62882005034977";
var VERSI_SDK="10.12.2";
/* ====== JANGAN DIUBAH DI BAWAH INI ====== */
(function(){
  var $=function(i){return document.getElementById(i);};
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];});}
  function rp(n){return "Rp"+(Number(n)||0).toLocaleString("id-ID");}
  var KUNCI="aromaPesananSaya", KUNCI_LIHAT="aromaStatusTerlihat";
  var LANGKAH=[
    ["baru","📝","Pesanan diterima","Admin akan segera mengonfirmasi lewat WhatsApp."],
    ["proses","🧴","Sedang diproses","Pesananmu sedang disiapkan."],
    ["kirim","🚚","Sedang dikirim","Paket sudah dikirim ke alamatmu."],
    ["selesai","✅","Selesai","Terima kasih sudah berbelanja 🌸"]];
  var NAMA={baru:"Diterima",proses:"Diproses",kirim:"Dikirim",selesai:"Selesai",batal:"Dibatalkan"};
  var IKON={baru:"📝",proses:"🧴",kirim:"🚚",selesai:"🎉",batal:"❌",hilang:"🔎",galat:"📡",muat:"⏳"};
  var db=null, status={}, terbuka={}, notif={}, tab="semua", berjalan=false, pertama=true;
  function baca(k){ try{ var a=JSON.parse(localStorage.getItem(k||KUNCI)||(k===KUNCI_LIHAT?"{}":"[]")); return a&&typeof a==="object"?a:(k===KUNCI_LIHAT?{}:[]); }catch(e){ return k===KUNCI_LIHAT?{}:[]; } }
  function tulis(a,k){ try{ localStorage.setItem(k||KUNCI,JSON.stringify(a)); }catch(e){} }
  function daftarPesanan(){ var a=baca(); return Array.isArray(a)?a:[]; }
  function toast(t){ var e=$("toast"); e.textContent=t; e.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(function(){ e.classList.remove("on"); },3200); }
  function muat(src){return new Promise(function(ok,gagal){var s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=function(){gagal(new Error("Tidak bisa terhubung. Periksa internetmu."));};document.head.appendChild(s);});}
  var b="https://www.gstatic.com/firebasejs/"+VERSI_SDK+"/";
  var siap=muat(b+"firebase-app-compat.js").then(function(){return muat(b+"firebase-firestore-compat.js");}).then(function(){ firebase.initializeApp(FIREBASE_CONFIG); db=firebase.firestore(); });
  function wa(no,teks){ return 'https://wa.me/'+NOMOR_WA+'?text='+encodeURIComponent(teks||("Halo, saya mau tanya pesanan "+no)); }

  /* hanya status yang dikenal yang diterima; selain itu dianggap tidak valid (tidak pernah ditebak jadi "Selesai") */
  function ambil(no){
    return siap.then(function(){ return db.collection("status").doc(no).get(); }).then(function(d){
      if(!d.exists) return {s:"hilang"};
      var x=d.data()||{}, s=String(x.status||"").toLowerCase();
      if(!NAMA[s]) return {s:"galat",pesan:"Status pesanan belum valid. Hubungi admin."};
      return {s:s,t:x.diperbarui&&x.diperbarui.toDate?x.diperbarui.toDate():null};
    }).catch(function(e){ return {s:(e&&e.code==="permission-denied")?"hilang":"galat",pesan:e&&e.message}; });
  }
  function tglPendek(t){ return t.toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); }
  function kategori(s){ return s==="baru"||s==="proses"?"proses":(s==="kirim"?"kirim":(s==="selesai"?"selesai":(s==="batal"?"batal":"lain"))); }

  function progres(s){
    var idx=-1; LANGKAH.forEach(function(l,i){ if(l[0]===s) idx=i; });
    return '<div class="pg">'+LANGKAH.map(function(l,i){ return '<div class="'+(i<idx?'ok':(i===idx?'on':''))+'"><span>'+(i<idx?'✓':l[1])+'</span>'+esc(NAMA[l[0]])+'</div>'; }).join("")+'</div>';
  }
  function garis(s,t){
    if(s==="batal") return '<div class="msg">❌ Pesanan ini dibatalkan. Kalau merasa tidak membatalkan, hubungi admin.</div>';
    var idx=-1; LANGKAH.forEach(function(l,i){ if(l[0]===s) idx=i; });
    var h='<ul class="tl">'+LANGKAH.map(function(l,i){ var k=i<idx?"lalu":(i===idx?"on":""); return '<li class="'+k+'"><i>'+(i<idx?"✓":(i+1))+'</i>'+esc(l[2])+(i===idx?'<small>'+esc(l[3])+'</small>':'')+'</li>'; }).join("")+'</ul>';
    if(t) h+='<div class="sub">Terakhir diperbarui: '+esc(tglPendek(t))+'</div>';
    return h;
  }
  function kartu(p){
    var st=status[p.nomor], s=st?st.s:"muat";
    var tampilS=(s==="hilang"||s==="galat"||s==="muat")?s:s;
    var judul, ket;
    if(s==="muat"){ judul="Memuat status…"; ket="Mohon tunggu sebentar."; }
    else if(s==="hilang"){ judul="Belum tercatat"; ket="Pesanan belum ditemukan di sistem toko."; }
    else if(s==="galat"){ judul="Gagal memuat"; ket=(st&&st.pesan)||"Periksa internet lalu tekan ⟳."; }
    else { var L=LANGKAH.filter(function(l){return l[0]===s;})[0]; judul=NAMA[s]; ket=L?L[3]:"Pesanan dibatalkan."; }
    var its=p.items||[], ringkas=its.length?(esc(its[0].nama)+' <small>'+esc(its[0].jenis)+' '+esc(its[0].ukuran)+' ×'+esc(its[0].qty)+'</small>'+(its.length>1?' <small>+'+(its.length-1)+' produk lain</small>':'')):'<small>Rincian tidak tersimpan di perangkat ini</small>';
    var tgl=p.tgl?new Date(p.tgl).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}):"";
    var det='';
    if(s==="hilang") det='<div class="msg">Pesanan ini belum tercatat di sistem toko. Kalau baru saja dipesan, tunggu sebentar lalu tekan ⟳. Kalau tetap begini, hubungi admin.</div>';
    else if(s==="galat") det='<div class="msg">Tidak bisa memuat status sekarang. Periksa internet lalu tekan ⟳.</div>';
    else if(s!=="muat") det=garis(s,st.t);
    var rinci=its.length?its.map(function(i){return '<div class="item"><span>'+esc(i.nama)+' <small>'+esc(i.jenis)+' '+esc(i.ukuran)+'</small></span><span>×'+esc(i.qty)+'</span></div>';}).join(""):"";
    var lihat=baca(KUNCI_LIHAT), baruTitik=(s!=="muat"&&s!=="hilang"&&s!=="galat"&&lihat[p.nomor]&&lihat[p.nomor]!==s)?'<span class="baru-titik">STATUS BARU</span>':'';
    var tombol='<a class="wa" target="_blank" rel="noopener" href="'+esc(wa(p.nomor))+'">💬 Tanya admin</a>';
    if(s==="selesai") tombol='<a class="ul" href="beri-ulasan.html">⭐ Beri ulasan</a>'+tombol;
    tombol+='<button class="hps" data-hapus="'+esc(p.nomor)+'" title="Hapus dari daftar">🗑️</button>';
    return '<div class="ord s-'+esc(tampilS)+(terbuka[p.nomor]?' buka':'')+'" data-no="'+esc(p.nomor)+'">'+
      '<div class="hd"><span class="no">'+esc(p.nomor)+'</span><button class="salin" data-salin="'+esc(p.nomor)+'">Salin</button>'+baruTitik+'<span class="tg">'+esc(tgl)+'</span></div>'+
      '<div class="sb"><i>'+(IKON[s]||"📦")+'</i><div><b>'+esc(judul)+'</b><small>'+esc(ket)+'</small></div></div>'+
      ((s==="baru"||s==="proses"||s==="kirim"||s==="selesai")?progres(s):'')+
      '<div class="ring">'+ringkas+'</div>'+
      '<div class="bw" data-buka="'+esc(p.nomor)+'"><b>'+(p.total?rp(p.total):'&nbsp;')+'</b><span>'+(terbuka[p.nomor]?'Tutup ▲':'Lihat rincian ▼')+'</span></div>'+
      '<div class="det">'+rinci+(rinci?'<div class="sub">Total sudah termasuk potongan, voucher, dan botol.</div>':'')+det+'<div class="aksi">'+tombol+'</div></div></div>';
  }
  function gambarTab(a){
    var n={semua:a.length,proses:0,kirim:0,selesai:0,batal:0};
    a.forEach(function(p){ var st=status[p.nomor]; if(st){ var k=kategori(st.s); if(n[k]!==undefined) n[k]++; } });
    var T=[["semua","Semua"],["proses","Diproses"],["kirim","Dikirim"],["selesai","Selesai"],["batal","Batal"]];
    $("tabs").innerHTML=a.length?T.map(function(t){ return '<button class="tab'+(tab===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+'<em>'+n[t[0]]+'</em></button>'; }).join(""):"";
  }
  function gambar(){
    var a=daftarPesanan();
    gambarTab(a);
    var tampil=a.filter(function(p){ if(tab==="semua") return true; var st=status[p.nomor]; return st&&kategori(st.s)===tab; });
    if(!a.length) $("daftar").innerHTML='<div class="kosong"><div class="ic">🛍️</div><b>Belum ada pesanan di perangkat ini</b>Pesanan yang kamu buat akan muncul di sini, lengkap dengan statusnya.<br><br><div class="aksi"><a class="ul" href="index.html">Mulai belanja</a></div></div>';
    else if(!tampil.length) $("daftar").innerHTML='<div class="kosong"><div class="ic">📭</div><b>Tidak ada pesanan di tab ini</b>Coba pilih tab lain.</div>';
    else $("daftar").innerHTML=tampil.map(kartu).join("");
  }
  function segarkan(manual){
    if(berjalan) return Promise.resolve();
    berjalan=true; $("segar").classList.add("putar");
    var a=daftarPesanan();
    if(pertama&&a.length&&Object.keys(status).length===0) $("daftar").innerHTML=a.map(function(){return '<div class="skel"></div>';}).join("");
    else gambar();
    var lihat=baca(KUNCI_LIHAT), berubah=[];
    return Promise.all(a.map(function(p){ return ambil(p.nomor).then(function(r){
      status[p.nomor]=r;
      if(r.s&&NAMA[r.s]){ if(lihat[p.nomor]&&lihat[p.nomor]!==r.s&&notif[p.nomor]!==r.s){ notif[p.nomor]=r.s; berubah.push(p.nomor+" → "+NAMA[r.s]); } }
    }); })).then(function(){
      pertama=false; gambar();
      if(berubah.length) toast("🔔 Status pesanan berubah: "+berubah.join(", "));
      else if(manual===true) toast("✔ Status sudah diperbarui");
    }).then(function(){ berjalan=false; $("segar").classList.remove("putar"); });
  }
  /* tandai status yang sudah dilihat saat kartu dibuka */
  function tandaiLihat(no){
    var st=status[no]; if(!st||!NAMA[st.s]) return;
    var l=baca(KUNCI_LIHAT); l[no]=st.s; tulis(l,KUNCI_LIHAT);
  }
  $("daftar").onclick=function(e){
    var t=e.target.closest("[data-salin]");
    if(t){ var no=t.getAttribute("data-salin");
      var ok=function(){ toast("Nomor "+no+" tersalin ✔"); };
      try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(no).then(ok,function(){ toast("Nomor: "+no); }); else toast("Nomor: "+no); }catch(x){ toast("Nomor: "+no); }
      return; }
    t=e.target.closest("[data-hapus]");
    if(t){ var n=t.getAttribute("data-hapus"); if(confirm("Hapus pesanan "+n+" dari daftar di perangkat ini?\n(Pesanan di toko tidak terhapus.)")){ tulis(daftarPesanan().filter(function(x){return x.nomor!==n;})); delete status[n]; gambar(); toast("Dihapus dari daftar"); } return; }
    t=e.target.closest("[data-buka]");
    if(t){ var m=t.getAttribute("data-buka"); terbuka[m]=!terbuka[m]; if(terbuka[m]) tandaiLihat(m); gambar(); }
  };
  $("tabs").onclick=function(e){ var t=e.target.closest("[data-tab]"); if(!t) return; tab=t.getAttribute("data-tab"); gambar(); };
  $("segar").onclick=function(){ segarkan(true); };

  function cari(){
    var no=$("no").value.trim().toUpperCase().replace(/\s+/g,"");
    if(!/^[A-Z0-9-]{4,39}$/.test(no)){ $("hasilCari").innerHTML='<div class="msg">Nomor pesanan tidak valid. Contoh: AS-1111-ABCD</div>'; return; }
    $("cari").disabled=true; $("hasilCari").innerHTML='<div class="kecil">Mencari…</div>';
    ambil(no).then(function(r){
      if(r.s==="hilang"){ $("hasilCari").innerHTML='<div class="msg">Pesanan <b>'+esc(no)+'</b> tidak ditemukan. Periksa lagi nomornya, atau <a style="color:#fff" target="_blank" href="'+esc(wa(no))+'">hubungi kami lewat WhatsApp</a>.</div>'; return; }
      if(r.s==="galat"){ $("hasilCari").innerHTML='<div class="msg">'+esc(r.pesan||"Terjadi kesalahan.")+'</div>'; return; }
      var a=daftarPesanan().filter(function(x){return x.nomor!==no;}); a.unshift({nomor:no,tgl:r.t?r.t.getTime():Date.now(),total:0,items:[]}); tulis(a.slice(0,30));
      status[no]=r; terbuka[no]=true; tab="semua"; tandaiLihat(no); $("hasilCari").innerHTML='<div class="kecil">✔ Pesanan ditemukan dan ditambahkan ke daftar di atas.</div>'; $("no").value=""; gambar();
      window.scrollTo(0,0);
    }).then(function(){ $("cari").disabled=false; });
  }
  $("cari").onclick=cari; $("no").onkeydown=function(e){ if(e.key==="Enter") cari(); };
  var q=""; try{ q=new URLSearchParams(location.search).get("no")||""; }catch(e){}
  /* pertama kali status sebuah pesanan dimuat, catat sebagai "sudah dilihat" supaya tanda STATUS BARU hanya muncul jika berubah setelahnya */
  var asliSegar=segarkan;
  segarkan=function(m){ return asliSegar(m).then(function(){ var l=baca(KUNCI_LIHAT), a=daftarPesanan(), ubah=false; a.forEach(function(p){ var st=status[p.nomor]; if(st&&NAMA[st.s]&&!l[p.nomor]){ l[p.nomor]=st.s; ubah=true; } }); if(ubah) tulis(l,KUNCI_LIHAT); }); };
  if(q){ $("no").value=q; cari(); }
  gambar();
  segarkan();
  setInterval(function(){ if(!document.hidden) segarkan(); },30000);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) segarkan(); });
})();
</script>
</body>
</html>
