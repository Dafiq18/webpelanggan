<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pesanan Saya — Aroma Semarang</title>
<style>
:root{--bg:#070b16;--panel:#0f1729;--line:rgba(255,255,255,.1);--tx:#eef2ff;--mut:#9aa6c4;--ac:#8b5cf6;--ac2:#22d3ee;--or:#ee4d2d;--or2:#ff7337;--ok:#34d399;--bad:#fb7185;--kn:#fbbf24;--bl:#60a5fa}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 80% -10%,rgba(139,92,246,.18),transparent),var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--or2),var(--or));padding:12px 16px;display:flex;align-items:center;gap:12px}
.top a,.top button{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;text-decoration:none;font-weight:900;border:0;font-size:16px;cursor:pointer}
.top b{font-size:17px;flex:1}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 60px}
.ord{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin-top:12px;overflow:hidden}
.ord>.hd{display:flex;gap:8px;align-items:center;padding:14px 16px 0;flex-wrap:wrap}
.ord .no{font-weight:800}.ord .tg{color:var(--mut);font-size:12px;margin-left:auto}
.stt{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px}
.stt.baru{background:rgba(96,165,250,.2);color:var(--bl)}.stt.proses{background:rgba(251,191,36,.2);color:var(--kn)}.stt.kirim{background:rgba(139,92,246,.25);color:#c4b5fd}.stt.selesai{background:rgba(52,211,153,.2);color:var(--ok)}.stt.batal,.stt.hilang{background:rgba(251,113,133,.2);color:var(--bad)}.stt.muat{background:rgba(255,255,255,.08);color:var(--mut)}
.ring{padding:8px 16px 0;color:#cbd5e1;font-size:14px}
.ring small{color:var(--mut)}
.bw{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 14px;cursor:pointer}
.bw b{font-size:16px}.bw span{color:var(--ac2);font-size:13px;font-weight:700}
.det{display:none;padding:4px 16px 16px;border-top:1px solid var(--line)}
.ord.buka .det{display:block}
.tl{list-style:none;margin:12px 0 0;padding:0}
.tl li{position:relative;padding:0 0 16px 38px;color:var(--mut)}
.tl li::before{content:"";position:absolute;left:11px;top:22px;bottom:-4px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li i{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:#1e293b;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px}
.tl li.on{color:var(--tx);font-weight:800}
.tl li.on i{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff}
.tl li.lalu{color:var(--tx)}.tl li.lalu i{background:rgba(52,211,153,.25);border-color:var(--ok);color:var(--ok)}
.tl small{display:block;font-weight:500;color:var(--mut)}
.item{display:flex;justify-content:space-between;gap:10px;color:#cbd5e1;font-size:13px;padding:2px 0}
.msg{padding:12px 14px;border-radius:12px;background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.35);color:#fecdd3;margin-top:10px;font-size:14px}
.batal{padding:12px 14px;border-radius:12px;background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.35);color:#fecdd3;font-weight:700;margin-top:10px}
.wa{display:block;text-align:center;margin-top:10px;padding:11px;border-radius:12px;background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;text-decoration:none;font-weight:800;font-size:14px}
.kosong{text-align:center;padding:40px 16px 20px;color:var(--mut)}
.kosong .ic{font-size:48px}
.kosong b{display:block;color:var(--tx);font-size:17px;margin:6px 0 4px}
.cari{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:18px}
.cari h3{margin:0 0 4px;font-size:15px}.cari p{margin:0 0 10px;color:var(--mut);font-size:13px}
.cari .row{display:flex;gap:8px}
input{flex:1;min-width:0;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;text-transform:uppercase;letter-spacing:.04em}
.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:800;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--or),var(--or2))}
.btn:disabled{opacity:.6}
.kecil{color:var(--mut);font-size:12px;margin-top:16px;text-align:center}
</style>
</head>
<body>
<div class="top"><a href="index.html" aria-label="Kembali">‹</a><b>📦 Pesanan Saya</b><button id="segar" aria-label="Segarkan" title="Segarkan">⟳</button></div>
<div class="wrap">
  <div id="daftar"></div>
  <div class="cari">
    <h3>Punya nomor pesanan dari perangkat lain?</h3>
    <p>Ketik nomornya (ada di pesan WhatsApp-mu), misalnya <b>AS-1111-ABCD</b>.</p>
    <div class="row"><input id="no" placeholder="AS-0000-XXXX" autocomplete="off" maxlength="39"><button class="btn" id="cari">Lacak</button></div>
    <div id="hasilCari"></div>
  </div>
  <div class="kecil">Daftar pesanan disimpan di perangkat ini. Status diperbarui oleh admin toko.</div>
</div>

<script>
/* ====== PENGATURAN ====== */
var FIREBASE_CONFIG={
  apiKey:"AIzaSyAWMBRY8TAJMCLSqTdMVKlo_U1aQCGa51k",
  authDomain:"aroma-semarang.firebaseapp.com",
  projectId:"aroma-semarang",
  storageBucket:"aroma-semarang.firebasestorage.app",
  messagingSenderId:"92275973960",
  appId:"1:92275973960:web:7653449d240a7b147d1d7d"
};
var NOMOR_WA="62882005034977";
var VERSI_SDK="10.12.2";
/* ====== JANGAN DIUBAH DI BAWAH INI ====== */
(function(){
  var $=function(i){return document.getElementById(i);};
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];});}
  function rp(n){return "Rp"+(Number(n)||0).toLocaleString("id-ID");}
  var KUNCI="aromaPesananSaya";
  var LANGKAH=[["baru","Pesanan diterima","Admin akan segera mengonfirmasi lewat WhatsApp."],["proses","Sedang diproses","Pesananmu sedang disiapkan."],["kirim","Sedang dikirim","Paket sudah dikirim ke alamatmu."],["selesai","Selesai","Terima kasih sudah berbelanja 🌸"]];
  var NAMA={baru:"Diterima",proses:"Diproses",kirim:"Dikirim",selesai:"Selesai",batal:"Dibatalkan"};
  var db=null, status={}, terbuka={};
  function baca(){ try{ var a=JSON.parse(localStorage.getItem(KUNCI)||"[]"); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
  function tulis(a){ try{ localStorage.setItem(KUNCI,JSON.stringify(a)); }catch(e){} }
  function muat(src){return new Promise(function(ok,gagal){var s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=function(){gagal(new Error("Tidak bisa terhubung. Periksa internetmu."));};document.head.appendChild(s);});}
  var b="https://www.gstatic.com/firebasejs/"+VERSI_SDK+"/";
  var siap=muat(b+"firebase-app-compat.js").then(function(){return muat(b+"firebase-firestore-compat.js");}).then(function(){ firebase.initializeApp(FIREBASE_CONFIG); db=firebase.firestore(); });
  function wa(no){ return '<a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+NOMOR_WA+'?text='+encodeURIComponent("Halo, saya mau tanya pesanan "+no)+'">💬 Tanya admin lewat WhatsApp</a>'; }

  function ambil(no){
    return siap.then(function(){ return db.collection("status").doc(no).get(); }).then(function(d){
      if(!d.exists) return {s:"hilang"};
      var x=d.data(); return {s:x.status,t:x.diperbarui&&x.diperbarui.toDate?x.diperbarui.toDate():null};
    }).catch(function(e){ return {s:(e&&e.code==="permission-denied")?"hilang":"galat",pesan:e&&e.message}; });
  }
  function garis(st,t){
    if(st==="batal") return '<div class="batal">❌ Pesanan ini dibatalkan.</div>';
    var idx=-1; LANGKAH.forEach(function(l,i){ if(l[0]===st) idx=i; });
    var h='<ul class="tl">'+LANGKAH.map(function(l,i){ var k=i<idx?"lalu":(i===idx?"on":""); return '<li class="'+k+'"><i>'+(i<idx?"✓":(i+1))+'</i>'+esc(l[1])+(i===idx?'<small>'+esc(l[2])+'</small>':'')+'</li>'; }).join("")+'</ul>';
    if(t) h+='<div class="kecil" style="text-align:left;margin-top:0">Terakhir diperbarui: '+esc(t.toLocaleString("id-ID",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}))+'</div>';
    return h;
  }
  function kartu(p){
    var st=status[p.nomor], s=st?st.s:"muat";
    var label=s==="muat"?"Memuat…":s==="hilang"?"Belum tercatat":s==="galat"?"Gagal memuat":(NAMA[s]||s);
    var its=p.items||[], ringkas=its.length?(esc(its[0].nama)+' <small>'+esc(its[0].jenis)+' '+esc(its[0].ukuran)+' ×'+its[0].qty+'</small>'+(its.length>1?' <small>+'+(its.length-1)+' produk lain</small>':'')):'<small>Rincian tidak tersimpan di perangkat ini</small>';
    var tgl=p.tgl?new Date(p.tgl).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}):"";
    var det='';
    if(s==="hilang") det='<div class="msg">Pesanan ini belum tercatat di sistem toko. Kalau baru saja dipesan, tunggu sebentar lalu tekan ⟳. Kalau tetap begini, hubungi admin.</div>';
    else if(s==="galat") det='<div class="msg">Tidak bisa memuat status sekarang. Periksa internet lalu tekan ⟳.</div>';
    else if(s!=="muat") det=garis(s,st.t);
    var rinci=its.length>1?its.map(function(i){return '<div class="item"><span>'+esc(i.nama)+' <small>'+esc(i.jenis)+' '+esc(i.ukuran)+'</small></span><span>×'+i.qty+'</span></div>';}).join(""):"";
    return '<div class="ord'+(terbuka[p.nomor]?' buka':'')+'" data-no="'+esc(p.nomor)+'"><div class="hd"><span class="no">'+esc(p.nomor)+'</span><span class="stt '+esc(s)+'">'+esc(label)+'</span><span class="tg">'+esc(tgl)+'</span></div>'+
      '<div class="ring">'+ringkas+'</div>'+
      '<div class="bw" data-buka="'+esc(p.nomor)+'"><b>'+(p.total?rp(p.total):'')+'</b><span>'+(terbuka[p.nomor]?'Tutup ▲':'Lihat status ▼')+'</span></div>'+
      '<div class="det">'+rinci+det+wa(p.nomor)+'</div></div>';
  }
  function gambar(){
    var a=baca();
    $("daftar").innerHTML=a.length?a.map(kartu).join(""):'<div class="kosong"><div class="ic">🛍️</div><b>Belum ada pesanan di perangkat ini</b>Pesanan yang kamu buat akan muncul di sini, lengkap dengan statusnya.<br><br><a class="wa" href="index.html">Mulai belanja</a></div>';
  }
  function segarkan(){
    var a=baca(); gambar();
    return Promise.all(a.map(function(p){ return ambil(p.nomor).then(function(r){ status[p.nomor]=r; }); })).then(gambar);
  }
  $("daftar").onclick=function(e){ var t=e.target.closest("[data-buka]"); if(!t) return; var n=t.getAttribute("data-buka"); terbuka[n]=!terbuka[n]; gambar(); };
  $("segar").onclick=segarkan;

  function cari(){
    var no=$("no").value.trim().toUpperCase().replace(/\s+/g,"");
    if(!/^[A-Z0-9-]{4,39}$/.test(no)){ $("hasilCari").innerHTML='<div class="msg">Nomor pesanan tidak valid. Contoh: AS-1111-ABCD</div>'; return; }
    $("cari").disabled=true; $("hasilCari").innerHTML='<div class="kecil">Mencari…</div>';
    ambil(no).then(function(r){
      if(r.s==="hilang"){ $("hasilCari").innerHTML='<div class="msg">Pesanan <b>'+esc(no)+'</b> tidak ditemukan. Periksa lagi nomornya, atau hubungi kami lewat WhatsApp.</div>'+wa(no); return; }
      if(r.s==="galat"){ $("hasilCari").innerHTML='<div class="msg">'+esc(r.pesan||"Terjadi kesalahan.")+'</div>'; return; }
      var a=baca().filter(function(x){return x.nomor!==no;}); a.unshift({nomor:no,tgl:r.t?r.t.getTime():Date.now(),total:0,items:[]}); tulis(a.slice(0,30));
      status[no]=r; terbuka[no]=true; $("hasilCari").innerHTML='<div class="kecil">✔ Pesanan ditemukan dan ditambahkan ke daftar di atas.</div>'; $("no").value=""; gambar();
      window.scrollTo(0,0);
    }).then(function(){ $("cari").disabled=false; });
  }
  $("cari").onclick=cari; $("no").onkeydown=function(e){ if(e.key==="Enter") cari(); };
  var q=""; try{ q=new URLSearchParams(location.search).get("no")||""; }catch(e){}
  if(q){ $("no").value=q; cari(); }
  segarkan();
  setInterval(function(){ if(!document.hidden) segarkan(); },60000);
})();
</script>
</body>
</html>
