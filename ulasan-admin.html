<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Ulasan — Aroma Semarang</title>
<style>
:root{--bg:#0b1120;--panel:#121a2e;--panel2:#18223b;--line:rgba(255,255,255,.1);--tx:#eef2ff;--mut:#9aa6c4;--or:#ee4d2d;--or2:#ff7337;--ok:#34d399;--bad:#fb7185;--kn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{position:sticky;top:0;z-index:20;background:rgba(11,17,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top h1{margin:0;font-size:18px;flex:1;min-width:150px}.top h1 small{display:block;font-size:11px;color:var(--mut);font-weight:500}
.btn{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:var(--panel2);border:1px solid var(--line);text-decoration:none;display:inline-block}
.btn.p{background:linear-gradient(135deg,var(--or),var(--or2));border:0}.btn.g{background:rgba(52,211,153,.2);border-color:rgba(52,211,153,.5);color:#a7f3d0}.btn.r{background:rgba(251,113,133,.15);border-color:rgba(251,113,133,.4);color:#fecdd3}.btn.s{padding:7px 11px;font-size:13px}.btn:disabled{opacity:.5}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.login{max-width:380px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}
.login h2{margin:0 0 4px}.login p{color:var(--mut);margin:0 0 16px}
.login input{width:100%;margin-bottom:10px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}
.login .btn{width:100%}.err{color:var(--bad);min-height:20px;margin-top:8px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:99px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:13px}.chip.on{background:var(--or);color:#fff;border-color:var(--or)}
.row{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.row .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--mut);font-size:12px}
.row .b{color:var(--kn);letter-spacing:2px;font-size:16px;margin:4px 0}.row p{margin:4px 0 8px;white-space:pre-line;word-break:break-word}
.row .a{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px}.tag.menunggu{background:rgba(251,191,36,.2);color:var(--kn)}.tag.disetujui{background:rgba(52,211,153,.2);color:var(--ok)}.tag.ditolak{background:rgba(251,113,133,.2);color:var(--bad)}
.hide{display:none!important}.kosong{text-align:center;color:var(--mut);padding:30px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000d;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:99;display:none}
</style>
</head>
<body>
<div id="vLogin" class="login hide">
  <h2>🔐 Masuk Admin</h2><p>Aroma Semarang — kelola ulasan</p>
  <input id="lEmail" type="email" placeholder="Email admin" autocomplete="username">
  <input id="lPass" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn p" id="lMasuk">Masuk</button><div class="err" id="lErr"></div>
</div>
<div id="vApp" class="hide">
  <div class="top"><h1>⭐ Kelola Ulasan<small id="who"></small></h1><a class="btn" href="pesanan.html">Pesanan</a><button class="btn" id="bKeluar">Keluar</button></div>
  <div class="wrap"><div class="chips" id="chips"></div><div id="isi"><div class="kosong">Memuat…</div></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ====== PENGATURAN ====== */
var FIREBASE_CONFIG={apiKey:"AIzaSyAWMBRY8TAJMCLSqTdMVKlo_U1aQCGa51k",authDomain:"aroma-semarang.firebaseapp.com",projectId:"aroma-semarang",storageBucket:"aroma-semarang.firebasestorage.app",messagingSenderId:"92275973960",appId:"1:92275973960:web:7653449d240a7b147d1d7d"};
var EMAIL_ADMIN="aromasemarang@gmail.com";
var VERSI_SDK="10.12.2";
/* ====== JANGAN DIUBAH DI BAWAH INI ====== */
(function(){
  var $=function(i){return document.getElementById(i);};
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];});}
  function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none";},2400);}
  var db,auth,data=[],filter="menunggu";
  function muat(src){return new Promise(function(ok,g){var s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=function(){g(new Error("Gagal memuat Firebase. Periksa koneksi internet."));};document.head.appendChild(s);});}
  var b="https://www.gstatic.com/firebasejs/"+VERSI_SDK+"/";
  muat(b+"firebase-app-compat.js").then(function(){return muat(b+"firebase-auth-compat.js");}).then(function(){return muat(b+"firebase-firestore-compat.js");}).then(mulai)
  .catch(function(e){$("vLogin").classList.remove("hide");$("lErr").textContent=e.message;});
  function mulai(){
    firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
    $("lMasuk").onclick=masuk;$("lPass").onkeydown=function(e){if(e.key==="Enter")masuk();};
    $("bKeluar").onclick=function(){auth.signOut();};
    auth.onAuthStateChanged(function(u){
      if(u&&(u.email||"").toLowerCase()===EMAIL_ADMIN.toLowerCase()){$("vLogin").classList.add("hide");$("vApp").classList.remove("hide");$("who").textContent=u.email;ambil();}
      else{if(u){$("lErr").textContent="Akun ini bukan admin.";auth.signOut();}$("vApp").classList.add("hide");$("vLogin").classList.remove("hide");}
    });
  }
  function masuk(){
    $("lErr").textContent="";var em=$("lEmail").value.trim(),pw=$("lPass").value;
    if(!em||!pw){$("lErr").textContent="Isi email dan password.";return;}
    $("lMasuk").disabled=true;
    auth.signInWithEmailAndPassword(em,pw).catch(function(e){var k=e&&e.code||"";$("lErr").textContent=/wrong-password|invalid-credential|user-not-found|invalid-email/.test(k)?"Email atau password salah.":/too-many/.test(k)?"Terlalu banyak percobaan. Tunggu 15–30 menit.":"Gagal masuk ("+k+").";}).then(function(){$("lMasuk").disabled=false;});
  }
  function tgl(d){ if(!d) return 0; if(d.toDate) return d.toDate().getTime(); var x=new Date(d).getTime(); return isNaN(x)?0:x; }
  function ambil(){
    db.collection("ulasan").get().then(function(s){
      data=[]; s.forEach(function(d){var x=d.data(); x.id=d.id; x._t=tgl(x.dibuat); data.push(x);});
      data.sort(function(a,b){return b._t-a._t;}); gambar();
    }).catch(function(e){ $("isi").innerHTML='<div class="kosong">Gagal memuat: '+esc(e.code||e.message)+'</div>'; });
  }
  function gambar(){
    var n={menunggu:0,disetujui:0,ditolak:0}; data.forEach(function(x){ if(n[x.status]!=null) n[x.status]++; });
    $("chips").innerHTML=[["menunggu","Menunggu ("+n.menunggu+")"],["disetujui","Disetujui ("+n.disetujui+")"],["ditolak","Ditolak ("+n.ditolak+")"]].map(function(c){return '<button class="chip'+(filter===c[0]?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</button>';}).join("");
    var l=data.filter(function(x){return x.status===filter;});
    $("isi").innerHTML=l.length?l.map(function(x){
      var b=Math.min(5,Math.max(1,Number(x.bintang)||5));
      return '<div class="row"><div class="h"><span>Pesanan '+esc(x.id)+' • '+(x._t?new Date(x._t).toLocaleString("id-ID"):"")+'</span><span class="tag '+esc(x.status)+'">'+esc(x.status)+'</span></div>'+
        '<div class="b">'+"★".repeat(b)+"☆".repeat(5-b)+'</div><p>“'+esc(x.isi)+'”</p><div style="color:var(--mut);margin-bottom:8px">'+esc(x.nama)+(x.kota?' • '+esc(x.kota):'')+(x.parfum?' • 🧴 '+esc(x.parfum):'')+'</div>'+
        '<div class="a">'+(x.status!=="disetujui"?'<button class="btn g s" data-a="disetujui" data-id="'+esc(x.id)+'">✓ Setujui</button>':'')+(x.status!=="ditolak"?'<button class="btn r s" data-a="ditolak" data-id="'+esc(x.id)+'">✕ Tolak</button>':'')+'<button class="btn s" data-a="hapus" data-id="'+esc(x.id)+'">Hapus</button></div></div>';
    }).join(""):'<div class="kosong">Tidak ada ulasan di sini.</div>';
  }
  $("chips").onclick=function(e){var t=e.target.closest("[data-f]");if(t){filter=t.dataset.f;gambar();}};
  $("isi").onclick=function(e){
    var t=e.target.closest("[data-a]"); if(!t) return; var id=t.dataset.id, a=t.dataset.a;
    if(a==="hapus"&&!confirm("Hapus ulasan ini permanen? Pelanggan itu tidak bisa menulis ulasan lagi untuk pesanan yang sama kalau tidak dihapus lewat Firebase.")) return;
    t.disabled=true;
    var p=a==="hapus"?db.collection("ulasan").doc(id).delete():db.collection("ulasan").doc(id).update({status:a});
    p.then(function(){ if(a==="hapus") data=data.filter(function(x){return x.id!==id;}); else data.forEach(function(x){if(x.id===id)x.status=a;}); toast(a==="disetujui"?"Disetujui ✔ — tampil di toko":a==="ditolak"?"Ditolak":"Dihapus"); gambar(); })
     .catch(function(er){ toast("Gagal: "+(er.code||er.message)); t.disabled=false; });
  };
})();
</script>
</body>
</html>
